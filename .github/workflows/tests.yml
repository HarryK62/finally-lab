# Runs every suite the project has: backend pytest, frontend vitest, and the
# Playwright E2E run that drives the real stack.
#
# The three jobs are independent so a failure names the layer that broke rather
# than the first step that happened to run. E2E needs both toolchains because
# its `pretest` builds the frontend export and its Playwright config starts
# uvicorn itself.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Fails if uv.lock has drifted from pyproject.toml — the Dockerfile runs
      # `uv sync --frozen`, so a stale lockfile breaks the image build.
      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Test
        run: uv run --extra dev pytest -q --cov=app

  frontend:
    name: Frontend (vitest + eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs before the build deliberately: `tsc` must pass on a clean checkout,
      # not only once `next build` has generated `.next/types`.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Build the static export
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `test/scripts/prepare.mjs` runs `next build` out of frontend/, so the
      # frontend's own dependencies have to be installed even though this job
      # never runs its unit tests.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Install E2E dependencies
        run: npm ci
        working-directory: test

      # --with-deps pulls the system libraries (libglib and friends) that a bare
      # runner lacks; without them Chromium fails to launch.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: test

      - name: Test
        run: npm test
        working-directory: test

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/.playwright/
          retention-days: 7
          if-no-files-found: ignore
